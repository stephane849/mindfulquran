name: Build & Release APK

on:
  push:
    branches:
      - claude/modest-archimedes-w6t940
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for a full release (e.g. v1.0.0); empty = alpha pre-release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Tag pushes (v*) publish a full release; branch pushes publish alpha pre-releases
      - name: Release metadata
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran ${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.0-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran v1.0.0-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install custom MainActivity (volume-button paging)
        run: cp native/MainActivity.java android/app/src/main/java/com/mindfulquran/app/MainActivity.java

      - name: Generate launcher icons from assets/
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "mindful-quran-${{ steps.meta.outputs.tag }}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: |
            ## Mindful Quran

            A calm, distraction-free Quran reader designed for the Mudita
            Kompakt (E Ink, 480×800), following Mudita Mindful Design.

            **Install:** download the `.apk` below and sideload it.

            ### Features
            - Browse by Surah, Juz, or Hizb; full-text search
            - Arabic (Scheherazade New) with English translation —
              M.A.S. Abdel Haleem default; Saheeh International,
              Yusuf Ali, Al-Hilali & Khan available
            - Continuous mushaf mode when translation is off
            - Tap dictionary: per-word gloss, transliteration, and full
              grammar (root, part of speech, parse) from the Quranic
              Arabic Corpus — offline; long-press in mushaf mode
            - Continue Reading resumes at your last ayah
            - Volume buttons page up/down; MMD scroll rail with
              tap/hold chevrons; adjustable Arabic text size
            - Pure black-on-white, zero animations — E Ink safe

            Quran text and translations from Quran.com. Grammar data from
            the Quranic Arabic Corpus (corpus.quran.com), GNU GPL.
          files: mindful-quran-${{ steps.meta.outputs.tag }}.apk
