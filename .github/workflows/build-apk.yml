name: Build & Release APK

on:
  push:
    branches:
      - claude/modest-archimedes-w6t940
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for a full release (e.g. v1.0.0); empty = alpha pre-release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Tag pushes (v*) publish a full release; branch pushes publish alpha pre-releases
      - name: Release metadata
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran ${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.3.1-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Mindful Quran v1.3.1-alpha.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Install custom MainActivity (volume-button paging)
        run: cp native/MainActivity.java android/app/src/main/java/com/mindfulquran/app/MainActivity.java

      # Capacitor's template hardcodes versionName "1.0" / versionCode 1;
      # stamp the release tag so Android settings shows the real version
      - name: Stamp Android version
        run: |
          VER="${{ steps.meta.outputs.tag }}"
          sed -i "s/versionName \"1.0\"/versionName \"${VER#v}\"/" android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Generate launcher icons from assets/
        run: npx @capacitor/assets generate --android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "mindful-quran-${{ steps.meta.outputs.tag }}.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: |
            ## Mindful Quran

            A calm, distraction-free Quran reader designed for the Mudita
            Kompakt (E Ink, 480×800), following Mudita Mindful Design.

            **Install:** download the `.apk` below and sideload it.

            ### Features
            - Fully offline — Quran text, four translations, word
              glosses, grammar, and search are all bundled in the APK
            - Browse by Surah, Juz, Hizb, or Awrad; each resumes
              independently at your last ayah
            - Arabic (Scheherazade New) with English translation —
              M.A.S. Abdel Haleem default; Saheeh International,
              Yusuf Ali, Al-Hilali & Khan available
            - Continuous mushaf mode when translation is off, with
              progress (% read · minutes left at your recitation speed)
            - Search in English or Arabic — bare Arabic letters match
              by root (e.g. علم finds every verse from that root)
            - Tap dictionary: per-word gloss, transliteration, and full
              grammar (root, part of speech, parse) from the Quranic
              Arabic Corpus
            - True page turns: volume buttons or screen taps flip whole
              pages on a line grid — no half-cut lines; sections flow
              into each other at their boundaries
            - Hardware back navigates within the app; MMD scroll rail
              with tap/hold chevrons; adjustable Arabic text size
            - Instant open: every surah, juz, and hizb page is
              prerendered at build time
            - Pure black-on-white, zero animations — E Ink safe

            Quran text and translations from Quran.com. Grammar data from
            the Quranic Arabic Corpus (corpus.quran.com), GNU GPL.
          files: mindful-quran-${{ steps.meta.outputs.tag }}.apk
